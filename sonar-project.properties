# Analysis of this repository on SonarQube Cloud (the organization comes from the
# SONAR_ORGANIZATION repository variable; see .github/workflows/ci.yml).
sonar.projectKey=sonarqube-go-client
sonar.projectName=sonarqube-go-client
# x-release-please-start-version
sonar.projectVersion=1.0.1
# x-release-please-end

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Generated code (*_gen.go, written by tools/codegen) is reviewed through its
# generator, not file by file. Inputs, fixtures and spreadsheets are not code.
sonar.exclusions=**/*_gen.go,**/*_gen_test.go,docs/**,spec/**,integration/testdata/**,dist/**

# The generator is a separate Go module that "go test ./..." does not run. Its
# issues are still analysed, but it is verified by its output instead of unit
# tests: CI regenerates and diffs the code, the generated table test covers
# every generated method, and the integration suite runs it against real servers.
sonar.coverage.exclusions=tools/codegen/**

# Produced by the unit job ("go test -race -coverprofile=coverage.out -json ./...").
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json

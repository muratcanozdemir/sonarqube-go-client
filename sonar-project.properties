sonar.projectKey=sonarqube-go-client
sonar.projectName=sonarqube-go-client
sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,spec/**,integration/testdata/**,dist/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=integration/testdata/**
# Generated code: analysed for issues but not for duplication.
sonar.cpd.exclusions=**/*_gen.go
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json

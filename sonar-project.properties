# Analysis of this repository on SonarQube Cloud (the organization comes from the
# SONAR_ORGANIZATION repository variable; see .github/workflows/ci.yml).
sonar.projectKey=sonarqube-go-client
sonar.projectName=sonarqube-go-client
# x-release-please-start-version
sonar.projectVersion=0.0.0
# x-release-please-end

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Generated code (tools/codegen output) is reviewed through its generator, not
# file by file. Inputs, fixtures and spreadsheets are not code.
sonar.exclusions=**/*_gen.go,**/*_gen_test.go,docs/**,spec/**,integration/testdata/**,dist/**

# Produced by the unit job ("go test -race -coverprofile=coverage.out -json ./...").
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
